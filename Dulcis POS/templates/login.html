<!DOCTYPE html>
<html lang="en">
<head>
    <base target="_self">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - StockSecure POS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            display: flex;
            overflow: hidden;
            width: 100%;
            max-width: 680px;
            min-height: 380px;
        }

        .left-section {
            flex: 1;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .brand-mark {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(102,126,234,0.35);
        }

        .brand-mark svg { width: 32px; height: 32px; }

        .brand-text {
            text-align: center;
            margin-top: 1rem;
        }

        .brand-text .name {
            font-size: 1.4rem;
            font-weight: 800;
            color: #1f2937;
            letter-spacing: -0.02em;
        }

        .brand-text .tagline {
            font-size: 0.7rem;
            color: #6b7280;
            margin-top: 0.15rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .right-section {
            flex: 1;
            padding: 2rem 2.25rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header { text-align: center; margin-bottom: 1.5rem; }
        .login-header h2 { font-size: 1.25rem; font-weight: 700; color: #1f2937; margin-bottom: 0.3rem; }
        .login-header p { color: #6b7280; font-size: 0.8rem; }

        .alert {
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            border: 1px solid transparent;
        }
        .alert-danger { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
        .alert-warning { background: #fef3c7; color: #92400e; border-color: #fde68a; }

        .form-group { margin-bottom: 0.9rem; }

        .input-wrap { position: relative; }
        .input-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa5b1;
            pointer-events: none;
            width: 15px;
            height: 15px;
        }

        .input-field {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            border: 1.5px solid transparent;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #374151;
            background: #f1f4f8;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
        }
        .input-field::placeholder { color: #9aa5b1; }
        .input-field:focus {
            outline: none;
            background: #fff;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.4rem;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn-login:hover { background: #38a169; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(72,187,120,0.35); }
        .btn-login:active { transform: translateY(0); }

        .footer-links {
            text-align: center;
            margin-top: 1.1rem;
            padding-top: 1rem;
            border-top: 1px solid #edf0f3;
        }
        .footer-links a {
            color: #8a94a3;
            font-size: 0.75rem;
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-links a:hover { color: #667eea; }
        .footer-links .divider { color: #d1d5db; margin: 0 0.6rem; }
        .footer-links .admin-link:hover { color: #e53e3e; }

        @media (max-width: 768px) {
            .left-section { display: none; }
            .login-container { max-width: 360px; }
            .right-section { padding: 2rem 1.5rem; }
        }
    </style>
<base target="_blank">

</head>
<body>
    <div class="login-container">
        <div class="left-section">
            <div class="brand-mark">
                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.993 2.993 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 002.25 1.016 2.993 2.993 0 002.25-1.016 3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72m-13.5 8.65h3.75a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75H6.75a.75.75 0 00-.75.75v3.75c0 .415.336.75.75.75z"/>
                </svg>
            </div>
            <div class="brand-text">
                <div class="name">StockSecure</div>
                <div class="tagline">Point of Sale</div>
            </div>
        </div>

        <div class="right-section">
            <div class="login-header">
                <h2>Staff Login</h2>
                <p>Cashiers and Managers sign in here</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" name="username" class="input-field" placeholder="Username" required autofocus autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" name="password" class="input-field" placeholder="Password" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>

            <div class="footer-links">
                <a href="{{ url_for('forgot_password') }}" target="_self">Forgot Password?</a>
                <span class="divider">·</span>
                <a href="{{ url_for('admin_login') }}" target="_self" class="admin-link">Admin Login →</a>
            </div>
        </div>
    </div>

</body>
</html>
